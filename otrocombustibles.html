<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aceites y Combustibles — RPM</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--ink:#1a1a2e;--mut:#64748b;--line:#e2e8f0;--blue:#2563eb;--blue-soft:#eff4ff;--green:#16a34a;--red:#dc2626;--amber:#d97706;--r:14px}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:16px 14px 110px;max-width:640px;margin:0 auto;-webkit-text-size-adjust:100%}
header{padding:10px 2px 14px}
.depo{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);font-weight:700}
h1{font-size:22px;margin-top:2px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#e3e8ef;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px;position:sticky;top:6px;z-index:10}
.tab{border:0;background:none;padding:11px 4px;border-radius:9px;font:600 14px inherit;font-family:inherit;color:var(--mut);cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.12)}
.tab.on.ent{color:var(--green)}.tab.on.sal{color:var(--red)}
.view{display:none}.view.on{display:block}
.sec{background:var(--card);border-radius:var(--r);margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.06);overflow:hidden}
.sec>button{width:100%;display:flex;align-items:center;gap:10px;padding:15px 16px;border:0;background:none;font:700 16px inherit;font-family:inherit;color:var(--ink);text-align:left;cursor:pointer}
.sec>button .ico{width:30px;height:30px;border-radius:9px;background:var(--blue-soft);display:grid;place-items:center;font-size:16px}
.sec>button .sum{margin-left:auto;font-size:12px;font-weight:600;color:var(--mut);max-width:42%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec>button::after{content:"▾";color:var(--mut);transition:transform .2s}
.sec.open>button::after{transform:rotate(180deg)}
.body{display:none;padding:2px 16px 16px;border-top:1px solid var(--line)}
.sec.open .body{display:block}
label{display:block;font-size:13px;font-weight:600;color:#334155;margin:13px 0 5px}
label small{font-weight:400;color:var(--mut)}
input,select,textarea{width:100%;font:16px inherit;font-family:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);color-scheme:light;text-transform:none}
input.up{text-transform:uppercase}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.otro{display:none;margin-top:8px}.otro.show{display:block}
.item{border:1.5px solid var(--line);border-radius:12px;padding:4px 13px 13px;margin-top:12px;background:#fafbfd;border-left:5px solid var(--amber)}
.item.comb{border-left-color:var(--blue)}.item.line{border-left-color:var(--red)}
.item h3{font-size:13px;color:var(--mut);margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:#fee2e2;color:var(--red);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer}
.total{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.add{width:100%;margin-top:12px;padding:12px;border:2px dashed #b6c6e8;background:var(--blue-soft);color:var(--blue);border-radius:12px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.cod{display:flex;gap:6px}.pf{flex:0 0 auto;min-width:54px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:10px;background:#f1f5f9;font-weight:700;font-size:14px;padding:0 8px}
.ubg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fotos{display:flex;gap:8px;flex-wrap:wrap}.fotos .fs{position:relative}.fotos img{width:78px;height:78px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line)}
.fotos .fs button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:var(--red);color:#fff;font-size:11px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(240,242,245,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:20}
.bar>div{max-width:640px;margin:0 auto}
.send{width:100%;padding:15px;border:0;border-radius:12px;background:var(--green);color:#fff;font:700 17px inherit;font-family:inherit;cursor:pointer}
.send.sal{background:var(--red)}.send:disabled{opacity:.6}
.err{display:none;background:#fee2e2;color:#991b1b;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:10px;font-weight:600}
.ok{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;z-index:50;padding:20px}
.ok.show{display:grid}
.ok>div{background:#fff;border-radius:18px;padding:28px 24px;text-align:center;max-width:320px;width:100%}
.ok .t{font-size:46px;color:var(--green)}.ok h2{font-size:20px;margin:6px 0}.ok p{color:var(--mut);font-size:14px;margin-bottom:16px}
.ok button{padding:12px 22px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:700 15px inherit;font-family:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:600 13px inherit;font-family:inherit;color:var(--mut);white-space:nowrap;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sc{background:#fff;border-radius:12px;padding:13px 14px;margin-top:8px;box-shadow:0 1px 3px rgba(15,23,42,.06);display:grid;grid-template-columns:1fr auto;gap:3px 10px;cursor:pointer}
.sc .fm{font-size:11.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.04em}
.sc .scd{font-weight:700;font-size:15px}.sc .scs{font-size:13px;color:var(--mut)}
.sc .scq{grid-row:1/4;grid-column:2;text-align:right;font-size:22px;font-weight:800;color:var(--green);align-self:center}
.sc .scq small{display:block;font-size:12px;font-weight:600;color:var(--mut)}.sc .scq.low{color:var(--red)}
.bd{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px}
.bd.good{background:#dcfce7;color:#15803d}.bd.bad{background:#fee2e2;color:#b91c1c}
.xp{display:none;grid-column:1/3;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;cursor:default}
.sc.open .xp{display:block}
.hist .h{font-size:13px;line-height:1.5;padding:7px 0;border-top:1px solid #f1f5f9;color:#475569}
.hist .h:first-child{border-top:0}.hist b.ENTRADA{color:var(--green)}.hist b.SALIDA{color:var(--red)}.hist b.DEVOLUCIÓN{color:var(--blue)}
.sp{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.sp img{width:90px;height:90px;object-fit:cover;border-radius:10px}
.empty{padding:26px 16px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>
  <div class="depo">RPM Construcciones · Depósito 4</div>
  <h1>Aceites y Combustibles</h1>
</header>

<div class="tabs">
  <button class="tab on ent" data-t="ENTRADA">⬇ Entrada</button>
  <button class="tab sal" data-t="SALIDA">⬆ Salida</button>
  <button class="tab" data-t="STOCK">▦ Ver stock</button>
</div>

<div class="view on" id="v-form">
  <div class="err" id="err"></div>

  <div class="sec open" id="s1">
    <button type="button"><span class="ico">📋</span>Datos del movimiento<span class="sum" id="sum1"></span></button>
    <div class="body">
      <label>Responsable</label><select id="resp"></select>
      <input class="otro up" id="resp_otro" placeholder="Nombre del responsable">
      <div id="boxEnt">
        <label>Proveedor <small>(opc.)</small></label><input class="up" id="proveedor" placeholder="Ej: YPF, distribuidora">
        <label>N° remito / factura <small>(opc.)</small></label><input id="factura" placeholder="Ej: 0001-00001234">
      </div>
    </div>
  </div>

  <div class="sec" id="s2">
    <button type="button"><span class="ico">🛢️</span>Productos<span class="sum" id="sum2"></span></button>
    <div class="body">
      <div id="itemsE"></div><button type="button" class="add" id="addE">＋ Agregar producto</button>
      <div id="itemsS"></div><button type="button" class="add" id="addS">＋ Agregar producto del stock</button>
    </div>
  </div>

  <div class="sec" id="s3">
    <button type="button"><span class="ico">🔗</span>Trazabilidad<span class="sum" id="sum3"></span></button>
    <div class="body">
      <label>Obra o destino</label><select id="obra"></select>
      <input class="otro up" id="obra_otro" placeholder="Nombre de la obra">
      <label>Vehículo / máquina que lo usa</label><select id="veh"></select>
      <input class="otro up" id="veh_otro" placeholder="Patente o código de flota">
      <label>Solicitante <small>(opc.)</small></label><input class="up" id="sol" placeholder="Quién pide el material">
      <div class="row">
        <div><label>Tipo de servicio <small>(opc.)</small></label><select id="srv"><option value="">Sin especificar</option></select></div>
        <div><label>Km u horómetro <small>(opc.)</small></label><input id="km" inputmode="decimal" placeholder="12500 km"></div>
      </div>
    </div>
  </div>

  <div class="sec" id="s4">
    <button type="button"><span class="ico">📝</span>Observaciones<span class="sum"></span></button>
    <div class="body"><label>Comentarios</label><textarea class="up" id="obs"></textarea></div>
  </div>
</div>

<div class="view" id="v-stock">
  <div class="chips" id="chips"></div>
  <input id="buscar" placeholder="Buscar producto, marca, código…" autocomplete="off">
  <div id="lst"></div>
</div>

<div class="bar" id="bar"><div><button class="send" id="send"></button></div></div>
<div class="ok" id="ok"><div><div class="t">✔</div><h2 id="okT"></h2><p>Se guardó en la hoja de Stock y Movimientos.</p><button id="okB">Cargar otro</button></div></div>
<datalist id="dlM"></datalist>
<input type="file" id="fileP" accept="image/*" hidden>

<script>
/* ===== CONFIG (editar) ===== */
const CONFIG = {
  url: "https://script.google.com/macros/s/AKfycbw5o6UAwEEJUs727rnHvchCL97Z66QlVJ1UZZg5y12_-1qkgs9_gXBX1Bj-8LUmoosd/exec",
  zona: "Depósito de Aceites y Combustibles",
  resp: ["Fernando","Pamela"],
  obras: ["Depósito","SUETRA","XIBI"],
  veh: ["Camión 01","Camioneta 02","Retroexcavadora","Grupo electrógeno"],   // ← editá con los reales
  serv: ["Preventivo","Correctivo"],
  ub: {dep:["3"],est:[1,2,3,4,5,6,7,8],col:Array.from({length:20},(_,i)=>i+1),fil:["A","B","C","D","E","F","G","H"]}
};
const LIQ={"Envase 1 L":1,"Envase 4 L":4,"Balde 20 L":20,"Tambor 200 L":200,"Granel (litros)":1};
const FAM={
  aceites:{n:"🛢️ Aceite / lubricante",u:"litros",campo:"tipo_aceite",req:1,codigo:1,pres:LIQ,
    tipos:{"Aceite Motor":"AC-M","Aceite Hidráulico":"AC-H","Aceite Diferencial (Ejes)":"AC-D","Aceite de Transmisión Hidráulica":"AC-TH"}},
  grasas:{n:"🧴 Grasa",u:"kg",pref:"GR",codigo:1,cr:1,pres:{"Cartucho 0,4 kg":0.4,"Pote 1 kg":1,"Balde 18 kg":18,"Granel (kg)":1}},
  refrigerantes:{n:"🧊 Líquido refrigerante",u:"litros",pref:"LR",codigo:1,cr:1,pres:LIQ},
  liquido_freno:{n:"🛑 Líquido de freno",u:"litros",pref:"LF",codigo:1,campo:"tipo",tipos:{"DOT 3":"","DOT 4":"","DOT 5":""},pres:LIQ},
  combustibles:{n:"⛽ Combustible",u:"litros",campo:"tipo_combustible",req:1,
    tipos:{"Nafta Súper":"","Nafta Premium (Infinia)":"","Gasoil":""},pres:{"Bidón 20 L":20,"Tambor 200 L":200,"Tanque / granel (litros)":1}}
};
/* ===== Estado y utilidades ===== */
const $=id=>document.getElementById(id),q=(d,s)=>d.querySelector(s),R=n=>Math.round(n*100)/100;
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let tipo="ENTRADA",stock=[],stockOk=false,txid=null,chip="Todos",fotoTgt=null,seq=0;
const ahora=()=>new Date().toLocaleString("es-AR",{hour12:false});
const uu=F=>F.u==="litros"?"L":"kg";
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
function fillSel(sel,arr,ph){sel.innerHTML=`<option value="">${ph}</option>`+arr.map(v=>`<option>${esc(v)}</option>`).join("")+`<option value="__otro">Otro…</option>`}
fillSel($("resp"),CONFIG.resp,"Elegí el responsable");fillSel($("obra"),CONFIG.obras,"Elegí la obra o destino");fillSel($("veh"),CONFIG.veh,"Elegí el vehículo");
$("srv").innerHTML+=CONFIG.serv.map(v=>`<option>${esc(v)}</option>`).join("");
["resp","obra","veh"].forEach(k=>$(k).addEventListener("change",()=>{$(k+"_otro").classList.toggle("show",$(k).value==="__otro");sums()}));
const val=k=>{const v=$(k).value;return v==="__otro"?$(k+"_otro").value.trim().toUpperCase():v};

/* acordeón exclusivo */
document.querySelectorAll(".sec>button").forEach(b=>b.addEventListener("click",()=>{
  const s=b.parentElement,was=s.classList.contains("open");
  document.querySelectorAll(".sec").forEach(x=>x.classList.remove("open"));
  if(!was)s.classList.add("open");
}));
/* pestañas */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");
  const k=t.dataset.t;
  if(k==="STOCK"){$("v-form").classList.remove("on");$("v-stock").classList.add("on");$("bar").style.display="none";loadStock();return}
  tipo=k;$("v-stock").classList.remove("on");$("v-form").classList.add("on");$("bar").style.display="";applyTipo();
  if(k==="SALIDA"&&!stockOk)loadStock(true);
}));
function applyTipo(){
  const e=tipo==="ENTRADA";
  $("boxEnt").style.display=e?"":"none";$("s3").style.display=e?"none":"";
  $("itemsE").style.display=$("addE").style.display=e?"":"none";
  $("itemsS").style.display=$("addS").style.display=e?"none":"";
  $("send").textContent=e?"Registrar entrada":"Registrar salida";$("send").className="send"+(e?"":" sal");sums();
}
function sums(){
  $("sum1").textContent=val("resp")||"";
  const n=document.querySelectorAll(tipo==="ENTRADA"?"#itemsE .item":"#itemsS .item").length;
  $("sum2").textContent=n?n+(n>1?" productos":" producto"):"Sin productos";
  $("sum3").textContent=[val("obra"),val("veh")].filter(Boolean).join(" · ");
}

/* ===== ENTRADA: productos ===== */
function addE(fam="aceites"){
  const d=document.createElement("div");d.className="item";d.dataset.fam=fam;d._f=[];
  d.innerHTML=`<h3><span class="ttl"></span><button type="button" class="x" title="Quitar">✕</button></h3>
  <label>Familia</label><select class="fam">${Object.keys(FAM).map(k=>`<option value="${k}">${FAM[k].n}</option>`).join("")}</select><div class="fb"></div>`;
  q(d,".fam").value=fam;$("itemsE").appendChild(d);draw(d);renum();sums();
}
function draw(d){
  const f=d.dataset.fam,F=FAM[f];d.classList.toggle("comb",f==="combustibles");d._f=[];
  const ops=a=>a.map(v=>`<option>${esc(v)}</option>`).join("");
  q(d,".fb").innerHTML=`
  ${F.campo?`<label>Tipo</label><select class="tp"><option value="">Elegí el tipo</option>${ops(Object.keys(F.tipos))}</select>`:""}
  <div class="row"><div><label>Marca <small>(opc.)</small></label><input class="mk up" list="dlM" placeholder="YPF, SHELL…"></div>
  ${F.codigo?`<div><label>Código${F.cr?"":" <small>(opc.)</small>"}</label><div class="cod"><span class="pf">${F.pref||"AC"}</span><input class="cn" type="number" inputmode="numeric" min="1" placeholder="Nº"></div></div>`:"<div></div>"}</div>
  <label>Presentación</label><select class="pr"><option value="">Elegí la presentación</option>${ops(Object.keys(F.pres))}</select>
  <div class="row"><div><label>Cantidad de envases</label><input class="ca" type="number" inputmode="decimal" min="0" step="any"></div>
  <div><label>${uu(F)} por envase</label><input class="lp" type="number" inputmode="decimal" min="0" step="any"></div></div>
  <div class="total"><span>Total a ingresar</span><span class="tot">0 ${uu(F)}</span></div>
  <label>Ubicación</label><div class="ubg">${[["dep","Depósito"],["est","Estante"],["col","Columna"],["fil","Fila"]].map(([k,t])=>`<select class="u_${k}"><option value="">${t}</option>${ops(CONFIG.ub[k])}</select>`).join("")}</div>
  <label>Fotos <small>(máx. 2)</small></label><div class="fotos"></div>
  <button type="button" class="add ph">📷 Sacar o elegir foto</button>
  <label>Observaciones <small>(opc.)</small></label><input class="ob up">`;
  if(CONFIG.ub.dep.length===1)q(d,".u_dep").value=CONFIG.ub.dep[0];
}
function calcE(d){const F=FAM[d.dataset.fam],t=R((+q(d,".ca").value||0)*(+q(d,".lp").value||0));q(d,".tot").textContent=t+" "+uu(F)}
function renum(){document.querySelectorAll("#itemsE .ttl").forEach((e,i)=>e.textContent="Producto "+(i+1));document.querySelectorAll("#itemsS .ttl").forEach((e,i)=>e.textContent="Producto "+(i+1))}
function fotosE(d){q(d,".fotos").innerHTML=d._f.map((b,i)=>`<div class="fs"><img src="data:image/jpeg;base64,${b}"><button type="button" data-rm="${i}">✕</button></div>`).join("");q(d,".ph").style.display=d._f.length>=2?"none":""}
$("itemsE").addEventListener("change",e=>{
  const d=e.target.closest(".item"),c=e.target.classList;if(!d)return;const F=FAM[d.dataset.fam];
  if(c.contains("fam")){d.dataset.fam=e.target.value;draw(d)}
  else if(c.contains("tp")){if(F.codigo&&!F.pref)q(d,".pf").textContent=F.tipos[e.target.value]||"AC"}
  else if(c.contains("pr")){q(d,".lp").value=F.pres[e.target.value]??"";calcE(d)}
});
$("itemsE").addEventListener("input",e=>{const d=e.target.closest(".item");if(d&&e.target.matches(".ca,.lp"))calcE(d)});
$("itemsE").addEventListener("click",e=>{
  const d=e.target.closest(".item");if(!d)return;
  if(e.target.closest(".x")){d.remove();renum();sums()}
  else if(e.target.closest(".ph")){fotoTgt={d};$("fileP").click()}
  else if(e.target.dataset.rm!==undefined){d._f.splice(+e.target.dataset.rm,1);fotosE(d)}
});
$("addE").onclick=()=>addE();

/* ===== SALIDA: líneas desde el stock ===== */
function prodOpts(){
  if(!stockOk)return'<option value="">Cargando stock…</option>';
  const g={};stock.forEach(s=>(g[s.familia]=g[s.familia]||[]).push(s));
  return'<option value="">Elegí el producto</option>'+Object.keys(g).sort().map(f=>`<optgroup label="${esc(f)}">`+g[f].map(s=>`<option value="${esc(s.id)}">${esc(s.descripcion)} · ${esc(s.marca)} (${s.stock_actual} ${esc(s.unidad)})</option>`).join("")+"</optgroup>").join("");
}
function addS(){
  const d=document.createElement("div");d.className="item line";
  d.innerHTML=`<h3><span class="ttl"></span><button type="button" class="x" title="Quitar">✕</button></h3>
  <label>Producto</label><select class="ps">${prodOpts()}</select><div class="hint disp"></div>
  <label>Cantidad que sale</label><input class="cs" type="number" inputmode="decimal" min="0" step="any">`;
  $("itemsS").appendChild(d);renum();sums();if(!stockOk)loadStock(true);
}
function refreshSel(){document.querySelectorAll(".ps").forEach(s=>{const v=s.value;s.innerHTML=prodOpts();s.value=v})}
$("itemsS").addEventListener("change",e=>{
  if(!e.target.classList.contains("ps"))return;const d=e.target.closest(".line"),p=stock.find(x=>x.id===e.target.value);
  q(d,".disp").textContent=p?`Disponible: ${p.stock_actual} ${p.unidad}`:"";
});
$("itemsS").addEventListener("click",e=>{const d=e.target.closest(".line");if(d&&e.target.closest(".x")){d.remove();renum();sums()}});
$("addS").onclick=addS;

/* ===== Fotos ===== */
function comprimir(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,800/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7).split(",")[1])};im.src=r.result};r.readAsDataURL(file)})}
$("fileP").onchange=async()=>{
  const f=$("fileP").files[0],t=fotoTgt;$("fileP").value="";if(!f||!t)return;
  const b=await comprimir(f);
  if(t.d){if(t.d._f.length<2){t.d._f.push(b);fotosE(t.d)}return}
  toast("Subiendo foto…");
  try{const r=await post({accion:"actualizar-imagen",id:t.id,foto_base64:b,modo:"agregar"});
    const p=stock.find(x=>x.id===t.id);if(p)p.imagen=r.imagen||"";renderStock();toast("Foto guardada")}
  catch(e){toast("No se pudo subir la foto: "+e.message)}
};

/* ===== Envío ===== */
async function post(p){
  const r=await fetch(CONFIG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"Error del servidor");return j;
}
function err(m){const e=$("err");e.textContent=m;e.style.display=m?"block":"none";if(m)window.scrollTo({top:0,behavior:"smooth"})}
function buildE(){
  const resp=val("resp");if(!resp)return"Indicá el responsable.";
  const ds=[...document.querySelectorAll("#itemsE .item")];if(!ds.length)return"Agregá al menos un producto.";
  const p={fecha:ahora(),tipo_movimiento:"ENTRADA",responsable:resp,obra:"Depósito",zona:CONFIG.zona,
    proveedor:$("proveedor").value.trim().toUpperCase(),factura:$("factura").value.trim()};const pres=[];
  for(const [i,d] of ds.entries()){
    const f=d.dataset.fam,F=FAM[f],n="Producto "+(i+1)+": ",tp=q(d,".tp")?q(d,".tp").value:"",cn=q(d,".cn")?q(d,".cn").value.trim():"";
    const env=+q(d,".ca").value||0,tot=R(env*(+q(d,".lp").value||0));
    if(F.req&&!tp)return n+"elegí el tipo.";
    if(!q(d,".pr").value)return n+"elegí la presentación.";
    if(!(tot>0))return n+"completá la cantidad y los "+uu(F)+" por envase.";
    if(F.cr&&!cn)return n+"falta el código (solo el número).";
    if(!q(d,".u_dep").value)return n+"elegí el depósito de la ubicación.";
    const it={marca:q(d,".mk").value.trim().toUpperCase(),cantidad:tot,unidad:F.u,observaciones:q(d,".ob").value.trim().toUpperCase(),
      deposito:q(d,".u_dep").value,estante:q(d,".u_est").value,columna:q(d,".u_col").value,fila:q(d,".u_fil").value};
    if(F.campo)it[F.campo]=tp;
    if(F.codigo&&cn)it.codigo=(F.pref||F.tipos[tp]||"AC")+"-"+cn;
    if(d._f.length)it.fotos_base64=d._f;
    (p[f]=p[f]||[]).push(it);pres.push((tp||F.n.replace(/^\S+\s/,""))+": "+env+" × "+q(d,".pr").value);
  }
  p.observaciones=[pres.join("; "),$("obs").value.trim().toUpperCase()].filter(Boolean).join(" | ");
  return p;
}
function buildS(){
  const resp=val("resp"),obra=val("obra"),veh=val("veh");
  if(!resp)return"Indicá el responsable.";if(!obra)return"Indicá la obra o destino.";if(!veh)return"Indicá el vehículo o máquina.";
  const ds=[...document.querySelectorAll("#itemsS .line")];if(!ds.length)return"Agregá al menos un producto.";
  const items=[];
  for(const d of ds){
    const p=stock.find(x=>x.id===q(d,".ps").value),c=+q(d,".cs").value;
    if(!p)return"Elegí el producto en cada línea.";if(!(c>0))return"Indicá la cantidad en cada línea.";
    const ya=items.filter(x=>x.id===p.id).reduce((s,x)=>s+x.cantidad,0);
    if(c+ya>p.stock_actual)return"Stock insuficiente de "+p.descripcion+" (hay "+p.stock_actual+" "+p.unidad+").";
    items.push({id:p.id,familia:p.familia,marca:p.marca,descripcion:p.descripcion,cantidad:c,unidad:p.unidad||"un"});
  }
  return{accion:"ajuste-rapido",zona:CONFIG.zona,tipo_movimiento:"SALIDA",fecha:ahora(),responsable:resp,obra,obs_general:$("obs").value.trim().toUpperCase(),
    solicitante:$("sol").value.trim().toUpperCase(),equipo:veh.toUpperCase(),tipo_servicio:$("srv").value,km_hs:$("km").value.trim(),items};
}
$("send").onclick=async()=>{
  err("");const p=tipo==="ENTRADA"?buildE():buildS();if(typeof p==="string"){err(p);return}
  const b=$("send");b.disabled=true;b.textContent="Enviando…";
  try{
    p._txid=txid=txid||(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random());
    await post(p);txid=null;
    $("okT").textContent=tipo==="ENTRADA"?"Entrada registrada":"Salida registrada";$("ok").classList.add("show");loadStock(true);
  }catch(e){err("No se pudo registrar: "+e.message+" (si reintentás, no se duplica).")}
  b.disabled=false;applyTipo();
};
$("okB").onclick=()=>{
  $("ok").classList.remove("show");$("itemsE").innerHTML="";$("itemsS").innerHTML="";
  ["proveedor","factura","sol","km","obs"].forEach(k=>$(k).value="");$("srv").value="";
  ["resp","obra","veh"].forEach(k=>{$(k).value="";$(k+"_otro").classList.remove("show");$(k+"_otro").value=""});
  document.querySelectorAll(".sec").forEach(x=>x.classList.remove("open"));$("s1").classList.add("open");
  tipo==="ENTRADA"?addE():addS();window.scrollTo({top:0});
};

/* ===== Stock ===== */
async function loadStock(silent){
  try{
    const r=await fetch(CONFIG.url+"?action=json&zona="+encodeURIComponent(CONFIG.zona)),j=await r.json();
    if(!j.ok)throw new Error(j.error||"Error del servidor");
    stock=j.productos||[];stockOk=true;
    $("dlM").innerHTML=[...new Set(stock.map(s=>s.marca).filter(m=>m&&m!=="No especificado"))].map(m=>`<option value="${esc(m)}">`).join("");
    refreshSel();if($("v-stock").classList.contains("on"))renderStock();
  }catch(e){if(!silent)$("lst").innerHTML=`<div class="empty">No se pudo cargar el stock.<br>${esc(e.message)}</div>`}
}
const links=s=>String(s||"").split("||").map(x=>x.trim()).filter(Boolean);
function renderStock(){
  const fams=["Todos",...new Set(stock.map(s=>s.familia).filter(Boolean))];
  $("chips").innerHTML=fams.map(f=>`<button class="chip${f===chip?" on":""}" data-f="${esc(f)}">${esc(f)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{chip=c.dataset.f;renderStock()});
  const t=$("buscar").value.toLowerCase().trim();
  const rows=stock.filter(s=>(chip==="Todos"||s.familia===chip)&&(s.descripcion+" "+s.marca+" "+s.familia+" "+s.id).toLowerCase().includes(t));
  if(!rows.length){$("lst").innerHTML='<div class="empty">No hay productos para mostrar.</div>';return}
  const open=document.querySelector(".sc.open")?.dataset.id;
  $("lst").innerHTML=rows.map(s=>{
    const ub=[s.ubicacion_deposito,s.ubicacion_estante,s.ubicacion_columna,s.ubicacion_fila].filter(Boolean).join(" / ");
    return`<div class="sc${s.id===open?" open":""}" data-id="${esc(s.id)}">
      <div><span class="fm">${esc(s.familia)}</span><span class="bd ${s.estado==="REPONER"?"bad":"good"}">${esc(s.estado)}</span></div>
      <div class="scd">${esc(s.descripcion)}</div><div class="scs">${esc(s.marca)} · ${esc(ub||"Sin ubicación")}</div>
      <div class="scq ${s.stock_actual<=0?"low":""}">${s.stock_actual}<small>${esc(s.unidad)}</small></div>
      <div class="xp"><div class="sp">${links(s.imagen).map(u=>`<img src="${esc(u)}" alt="">`).join("")}</div>
        <button type="button" class="add" data-ph="${esc(s.id)}" style="margin:0 0 10px">📷 Agregar foto</button>
        <div class="hist"><div class="hint">Cargando historial…</div></div></div></div>`}).join("");
}
$("lst").addEventListener("click",async e=>{
  const c=e.target.closest(".sc");if(!c)return;
  if(e.target.dataset.ph){const p=stock.find(x=>x.id===e.target.dataset.ph);
    if(links(p&&p.imagen).length>=2){toast("Ya tiene 2 fotos");return}
    fotoTgt={id:e.target.dataset.ph};$("fileP").click();return}
  if(e.target.closest(".xp"))return;
  const was=c.classList.contains("open");document.querySelectorAll(".sc.open").forEach(x=>x.classList.remove("open"));
  if(was)return;c.classList.add("open");const h=q(c,".hist");
  try{
    const r=await fetch(CONFIG.url+"?action=historial&id="+encodeURIComponent(c.dataset.id)),j=await r.json();
    if(!j.ok)throw new Error(j.error);
    h.innerHTML=j.movimientos.length?j.movimientos.slice(0,10).map(m=>`<div class="h"><b class="${esc(m.tipo)}">${esc(m.tipo)}</b> ${m.tipo==="SALIDA"?"−":"+"}${m.cantidad} ${esc(m.unidad)} · ${esc(m.fecha)}<br>👤 ${esc(m.responsable||"—")} · 🏗️ ${esc(m.obra||"—")}${m.equipo?" · 🚚 "+esc(m.equipo)+(m.km_hs?" · "+esc(m.km_hs):""):""}${m.solicitante?"<br>🙋 "+esc(m.solicitante):""}</div>`).join(""):'<div class="hint">Sin movimientos registrados.</div>';
  }catch(x){h.innerHTML='<div class="hint">No se pudo cargar el historial.</div>'}
});
$("buscar").addEventListener("input",renderStock);

addE();applyTipo();loadStock(true);
</script>
